name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: metering-billing-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METERING_BILLING_POSTGRES_DSN: dbname=metering_billing_test user=postgres password=postgres host=127.0.0.1 port=5432
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: metering_billing_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metering_billing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-quality.txt
            requirements-runtime.txt
      - name: Install hash-locked quality dependency
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-quality.txt
      - name: Install hash-locked runtime dependency
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-runtime.txt
      - name: Apply PostgreSQL migrations with advisory lock
        run: python scripts/migrate_postgres.py --dsn "$METERING_BILLING_POSTGRES_DSN"
      - name: Run tests with complete branch coverage
        run: python -m coverage run --branch --source=scripts,metering_billing -m unittest discover -s tests -v
      - name: Enforce complete statement and branch coverage
        run: python -m coverage report --fail-under=100 --show-missing
      - name: Validate repository contracts
        run: python scripts/validate_repository.py .
      - name: Compile quality tooling
        run: python -m compileall -q scripts tests metering_billing
      - name: Run Rust producer SDK tests
        run: cargo test --manifest-path sdks/rust/Cargo.toml --locked
      - name: Install pinned Rust coverage toolchain
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal --no-self-update
          rustup component add llvm-tools-preview --toolchain nightly-2026-08-21
          cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Report Rust producer SDK coverage
        run: >-
          cargo +nightly-2026-08-21 llvm-cov
          --locked
          --manifest-path sdks/rust/Cargo.toml
          --features coverage
          --branch
          --fail-under-lines 100
          --fail-under-functions 100
          --summary-only
      - name: Enforce Rust producer SDK branch coverage
        run: |
          set -o pipefail
          cargo +nightly-2026-08-21 llvm-cov \
            --locked \
            --manifest-path sdks/rust/Cargo.toml \
            --features coverage \
            --branch \
            --json \
            --summary-only \
            | python -c 'import json, sys; branches = json.load(sys.stdin)["data"][0]["totals"]["branches"]; assert branches["covered"] == branches["count"], "Rust branch coverage is {}/{}".format(branches["covered"], branches["count"])'
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.6.0"
      - name: Install TypeScript producer SDK dependencies
        working-directory: sdks/typescript
        run: npm ci --ignore-scripts
      - name: Build TypeScript producer SDK
        working-directory: sdks/typescript
        run: npm run build
      - name: Run TypeScript producer SDK tests
        run: >-
          node --experimental-strip-types --test --experimental-test-coverage
          --test-coverage-include=sdks/typescript/src/index.ts
          --test-coverage-lines=100
          --test-coverage-branches=100
          --test-coverage-functions=100
          sdks/typescript/test/conformance.test.ts
      - name: Verify packed TypeScript producer SDK
        working-directory: sdks/typescript
        run: npm run test:package
