name: Publish producer SDKs

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: producer-sdk-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.resolve.outputs.release-sha }}
    steps:
      - name: Resolve release tag once
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r object_type object_sha < <(
            gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.type + " " + .object.sha'
          )
          for _ in 1 2 3 4; do
            case "$object_type" in
              commit)
                printf 'release-sha=%s\n' "$object_sha" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              tag)
                read -r object_type object_sha < <(
                  gh api "repos/${REPOSITORY}/git/tags/${object_sha}" \
                    --jq '.object.type + " " + .object.sha'
                )
                ;;
              *)
                echo "unsupported release tag target: ${object_type}" >&2
                exit 1
                ;;
            esac
          done
          echo "release tag target did not resolve to a commit" >&2
          exit 1

  build-python:
    name: Build Python distribution
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release.outputs.release-sha }}
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.19"
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Store Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: producer-python-dist
          path: dist/*
          if-no-files-found: error

  build-rust:
    name: Package Rust crate
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release.outputs.release-sha }}
          persist-credentials: false
      - name: Validate publishable crate
        run: cargo package --locked --manifest-path sdks/rust/Cargo.toml
      - name: Store Rust artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: producer-rust-dist
          path: sdks/rust/target/package/*.crate
          if-no-files-found: error

  build-typescript:
    name: Package TypeScript module
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release.outputs.release-sha }}
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.6.0"
          registry-url: "https://registry.npmjs.org"
      - name: Create npm package
        working-directory: sdks/typescript
        run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - name: Store TypeScript artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: producer-typescript-dist
          path: sdks/typescript/dist/*.tgz
          if-no-files-found: error

  publish:
    name: Publish verified producer artifacts
    needs:
      - resolve-release
      - build-python
      - build-rust
      - build-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producer-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release.outputs.release-sha }}
          persist-credentials: false
      - name: Download Python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-python-dist
          path: dist/python
      - name: Download Rust artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-rust-dist
          path: dist/rust
      - name: Verify Rust artifact before publishing
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --manifest-path sdks/rust/Cargo.toml
          mapfile -t uploaded < <(printf '%s\n' dist/rust/*.crate)
          mapfile -t rebuilt < <(printf '%s\n' sdks/rust/target/package/*.crate)
          test "${#uploaded[@]}" -eq 1
          test "${#rebuilt[@]}" -eq 1
          test "$(sha256sum "${uploaded[0]}" | awk '{print $1}')" = \
            "$(sha256sum "${rebuilt[0]}" | awk '{print $1}')"
      - name: Download TypeScript artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-typescript-dist
          path: dist/typescript
      - name: Publish Python distribution with OIDC provenance
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/python/
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.6.0"
          registry-url: "https://registry.npmjs.org"
      - name: Publish TypeScript package with provenance
        run: npm publish dist/typescript/*.tgz --provenance --access public
      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path sdks/rust/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"
