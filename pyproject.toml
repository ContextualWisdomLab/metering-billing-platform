[project]
name = "metering-billing-platform"
version = "0.2.0"
description = "Provider-neutral commercial metering and billing control plane"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "coverage==7.15.4",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
schemas = ["**/*.json"]

[tool.setuptools.packages.find]
include = ["metering_billing*", "schemas*", "scripts*"]
