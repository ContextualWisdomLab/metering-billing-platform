[project]
name = "metering-billing-platform"
version = "0.2.0"
description = "Provider-neutral commercial metering and billing control plane"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "coverage==7.15.4",
]

[tool.uv]
package = false
